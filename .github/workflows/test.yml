name: Regression Tests

# 感度計算が意図せず変わっていないことを、変更のたびに確認する。
# 機能を追加してもここが緑のままなら「ベースを崩していない」と言える。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ゲームタイトル定義の同期確認（games.json ⇔ index.html）
        run: node tools/sync-games.mjs --check

      - name: Metric Registry の同期確認（metrics.json ⇔ metric-registry.js）
        run: node tools/sync-metrics.mjs --check

      - name: Algorithm Config の同期確認（algorithm-config.json ⇔ algorithm-config.js）
        run: node tools/sync-algorithm-config.mjs --check

      - name: 感度計算の回帰テスト（JS / 8064 パターン）
        run: node tests/regression.mjs

      - name: Importer のテスト（KovaaK Adapter プロトタイプ）
        run: node tests/importers.mjs

      - name: Profile のテスト（Multi-source Aim Profile プロトタイプ）
        run: node tests/profile.mjs

      - name: Registry / 再推定のテスト（Phase E.5 / F プロトタイプ）
        run: node tests/re-estimation.mjs

      - name: Robustness テスト（Phase F.5 / 悪条件20ケース）
        run: node tests/robustness.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python 依存の導入
        run: pip install -r requirements.txt

      - name: JS と Python の計算一致を検証
        run: python tests/cross_check.py
