<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0b0f19;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
     color:#f8fafc;display:flex;overflow:hidden;position:relative}
body::before{content:'';position:absolute;inset:0;
  background:radial-gradient(900px 500px at 88% 18%, rgba(56,189,248,.20), transparent 62%);}
.left{flex:1.25;padding:70px 0 70px 76px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;z-index:1}
.eyebrow{font-size:19px;font-weight:700;letter-spacing:.26em;color:#38bdf8}
h1{font-size:74px;font-weight:800;line-height:1.14;letter-spacing:.005em}
.en{font-size:26px;font-weight:700;color:#94a3b8;letter-spacing:.03em}
.desc{font-size:25px;color:#cbd5e1;line-height:1.65;max-width:19em}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.chip{font-size:18px;font-weight:700;color:#7dd3fc;border:1px solid #1e4a5f;background:#0e1b28;border-radius:999px;padding:7px 16px}
.url{font-size:22px;color:#64748b;letter-spacing:.02em;margin-top:6px}
.right{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding-right:64px}
.panel{background:#131b2e;border:1px solid #223049;border-radius:26px;padding:38px 44px;box-shadow:0 24px 60px rgba(0,0,0,.55);
       display:flex;flex-direction:column;align-items:center;gap:6px;min-width:330px}
.panel .lab{font-size:17px;color:#94a3b8;letter-spacing:.06em}
.panel .game{font-size:21px;font-weight:700;color:#38bdf8;margin-top:2px}
.panel .val{font-size:96px;font-weight:800;color:#38bdf8;line-height:1.05;font-family:"Helvetica Neue",Arial,sans-serif}
.panel .dpi{font-size:17px;color:#64748b;border-top:1px solid #223049;padding-top:12px;margin-top:10px;width:100%;text-align:center}
</style></head><body>
<div class="left">
  <div class="eyebrow">AIM SENSITIVITY ENGINE</div>
  <h1>ロングケープ<br>の定理</h1>
  <div class="en">Long Cape Theorem</div>
  <div class="desc">身長・腕の太さ・器用さ・マウス重量・エイムの支点から、最適インゲーム感度を算出する</div>
  <div class="chips"><span class="chip">VALORANT</span><span class="chip">Apex</span><span class="chip">Overwatch 2</span><span class="chip">Fortnite</span><span class="chip">PUBG</span></div>
  <div class="url">longcapenotieri.jp</div>
</div>
<div class="right">
  <div class="panel">
    <div class="lab">あなたの理論上の最適感度</div>
    <div class="game">VALORANT / CS2</div>
    <div class="val">0.215</div>
    <div class="dpi">算出基準 DPI : 800</div>
  </div>
</div>
</body></html>
